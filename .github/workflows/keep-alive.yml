name: Keep Alive All Projects

on:
  workflow_dispatch:
  schedule:
    # 每 3 天自动运行一次（比每周一次更保险，远低于 7 天休眠门槛）
    - cron: '0 4 */3 * *'

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 智能交叉匹配 + 自动投递日志打卡
        run: |
          URLS=(
            "${{ secrets.SUPABASE_URL }}"
            "${{ secrets.SUPABASE_URL_2 }}"
          )
          KEYS=(
            "${{ secrets.SUPABASE_KEY }}"
            "${{ secrets.SUPABASE_KEY_2 }}"
          )

          SUCCESS_COUNT=0

          for url in "${URLS[@]}"; do
            [ -z "$url" ] && continue
            clean_url="${url%/}"
            
            echo "===================================="
            echo "正在探测并投递日志至: ${clean_url}"
            
            for key in "${KEYS[@]}"; do
              [ -z "$key" ] && continue
              
              # 往 keep_alive_logs 表中写入一条机器人日志
              HTTP_CODE=$(curl -g -s -o /dev/null -w "%{http_code}" -X POST "${clean_url}/rest/v1/keep_alive_logs" \
                -H "apikey: ${key}" \
                -H "Authorization: Bearer ${key}" \
                -H "Content-Type: application/json" \
                -H "Prefer: return=minimal" \
                -d "{\"content\": \"机器人定时巡检打卡于 $(date '+%Y-%m-%d %H:%M:%S')\"}")
              
              if [ "$HTTP_CODE" -eq 201 ] || [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 204 ]; then
                echo "🎉 [打卡成功] 成功向数据库写入测试日志！项目已激活！"
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                break
              fi
            done
          done

          if [ "$SUCCESS_COUNT" -eq 0 ]; then
            echo "❌ 失败：没有找到任何可用的网址与密钥组合，或表名创建有误。"
            exit 1
          fi

      - name: 刷新仓库活跃状态（防 GitHub 60天休眠）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "Last active: $(date -u)" > .github/keep_alive_timestamp
          git add .github/keep_alive_timestamp
          git commit -m "chore: auto refresh repo activity [skip ci]" || exit 0
          git push
