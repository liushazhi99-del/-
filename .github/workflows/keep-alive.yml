name: Keep Alive All Projects

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 */3 * *'

# 赋予脚本向仓库提交代码的写入权限
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # 第一步：拉取仓库代码
      - name: Checkout repo
        uses: actions/checkout@v4

      # 第二步：交叉匹配打卡 Supabase
      - name: 智能交叉匹配打卡保活
        run: |
          URLS=(
            "${{ secrets.SUPABASE_URL }}"
            "${{ secrets.SUPABASE_URL_2 }}"
          )
          KEYS=(
            "${{ secrets.SUPABASE_KEY }}"
            "${{ secrets.SUPABASE_KEY_2 }}"
          )

          SUCCESS_COUNT=0

          for url in "${URLS[@]}"; do
            [ -z "$url" ] && continue
            clean_url="${url%/}"
            
            echo "===================================="
            echo "正在探测网址: ${clean_url}"
            
            for key in "${KEYS[@]}"; do
              [ -z "$key" ] && continue
              
              HTTP_CODE=$(curl -g -s -o /dev/null -w "%{http_code}" -X GET "${clean_url}/rest/v1/" \
                -H "apikey: ${key}" \
                -H "Authorization: Bearer ${key}")
              
              if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 204 ]; then
                echo "🎉 [打卡成功] 秘钥匹配正确！项目已成功保活！"
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                break
              fi
            done
          done

          if [ "$SUCCESS_COUNT" -eq 0 ]; then
            echo "❌ 失败：没有找到任何可用的网址与密钥组合。"
            exit 1
          fi

      # 第三步：自动提交代码，伪造仓库活跃度（防 GitHub 60天休眠）
      - name: 刷新仓库活跃状态
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "Last active: $(date -u)" > .github/keep_alive_timestamp
          git add .github/keep_alive_timestamp
          git commit -m "chore: auto refresh repo activity [skip ci]" || exit 0
          git push
